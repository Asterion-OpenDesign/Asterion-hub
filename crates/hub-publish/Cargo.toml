[package]
name = "asterion-publish"
description = "Publisher CLI for the ASTERION catalog: keys, releases, signed catalog, verification, local test server."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "asterion-publish"
path = "src/main.rs"

[dependencies]
asterion-hub-core = { path = "../hub-core", features = ["publisher"] }
clap = { version = "4", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
time.workspace = true
base64.workspace = true
semver.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tiny_http = "0.12"
url.workspace = true

[dev-dependencies]
tempfile = "3"
